<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookStore - Your Online Bookshop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #232f3e;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
    }
    .search-bar {
      flex: 1;
      margin: 0 20px;
    }
    .search-bar input {
      width: 80%;
      padding: 8px;
    }
    .search-bar button {
      padding: 8px 12px;
      background-color: #febd69;
      border: none;
      cursor: pointer;
    }
    nav {
      background-color: #37475a;
      padding: 10px;
      color: white;
    }
    nav a {
      color: white;
      margin-right: 15px;
      text-decoration: none;
    }
    .container {
      display: flex;
      margin: 20px;
    }
    .sidebar {
      width: 20%;
      background: #fff;
      padding: 15px;
      border-right: 1px solid #ddd;
    }
    .sidebar h3 {
      margin-top: 0;
    }
    .products {
      width: 80%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 15px;
    }
    .product {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .product h4 {
      margin: 10px 0;
    }
    .product button {
      background-color: #febd69;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
    footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>BookStore</h1>
    <div class="search-bar">
      <input type="text" placeholder="Search for books...">
      <button>Search</button>
    </div>
    <div class="account">
      <a href="#" style="color:white;">Sign In</a>
    </div>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Best Sellers</a>
    <a href="#">New Arrivals</a>
    <a href="#">Genres</a>
    <a href="#">Deals</a>
  </nav>

  <div class="container">
    <div class="sidebar">
      <h3>Categories</h3>
      <ul>
        <li><a href="#">Fiction</a></li>
        <li><a href="#">Non-Fiction</a></li>
        <li><a href="#">Science</a></li>
        <li><a href="#">History</a></li>
        <li><a href="#">Children</a></li>
      </ul>
    </div>

    <div class="products">
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Book 1">
        <h4>The Great Gatsby</h4>
        <p>$10.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Book 2">
        <h4>1984</h4>
        <p>$8.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Book 3">
        <h4>Harry Potter</h4>
        <p>$12.99</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 BookStore. All rights reserved.</p>
  </footer>
</body>
</html>
